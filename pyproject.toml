[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "failsmart-matengine"
version = "3.0.0"
description = "13-Agent Fail-Smart Photovoltaic Materials Discovery Engine with Live Materials Project API & Blinded Redundancy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ase>=3.29.0",
    "mp-api>=0.46.0",
    "numpy>=2.4.0",
    "pvlib>=0.16.0",
    "pydantic>=2.14.0",
    "pymatgen>=2026.10.0",
    "python-dotenv>=1.2.0",
    "pyxtal>=1.1.5",
    "scipy>=1.17.0",
    "smact>=4.0.0",
    "spglib>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Issues encountered while parsing CIF.*:UserWarning",
]
