[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "failsmart-matengine"
dynamic = ["version"]
description = "Heuristic pre-screening scaffold and failure ledger for 4-terminal tandem photovoltaics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ase>=3.29.0",
    "mp-api>=0.46.0",
    "numpy>=2.4.0",
    "pvlib>=0.16.0",
    "pydantic>=2.14.0",
    "pymatgen>=2026.10.0",
    "python-dotenv>=1.2.0",
    "pyxtal>=1.1.5",
    "scipy>=1.17.0",
    "smact>=4.0.0",
    "spglib>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: tests that pin repository outputs, funnel counts, or self-consistency snapshots",
]
filterwarnings = [
    "ignore:Issues encountered while parsing CIF.*:UserWarning",
    "ignore:No oxidation states specified on sites.*:UserWarning",
    "ignore:CrystalNN.*:UserWarning",
]

[tool.setuptools.packages.find]
include = ["failsmart_matengine*"]

[tool.setuptools.dynamic]
version = {attr = "failsmart_matengine.__version__"}

